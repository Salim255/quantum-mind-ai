<div class="practice-home">

  <!-- ==================================================
  INTRO
  ================================================== -->
  <app-practice-home-header></app-practice-home-header>


  <!-- ==================================================
  PURPOSE
  ================================================== -->
  <app-practice-purpose></app-practice-purpose>


  <!-- ==================================================
  WAYS TO PRACTICE
  ================================================== -->
  <app-practice-paths></app-practice-paths>

  <!-- ==================================================
       LEARNING LOOP
  ================================================== -->

  <section
    class="practice-home__guidance"
    aria-labelledby="practice-guidance-title"
  >

    <div class="practice-home__guidance-icon" aria-hidden="true">

      <iconify-icon
        icon="lucide:refresh-cw"
      ></iconify-icon>

    </div>

    <div class="practice-home__guidance-content">

      <h2
        id="practice-guidance-title"
        class="practice-home__guidance-title"
      >
        Practice, review, understand, repeat.
      </h2>

      <p class="practice-home__guidance-description">
        A quiz can show you what is clear and what is not.
        When a question exposes a gap, return to the relevant
        lesson, strengthen the idea, and try again.
      </p>

    </div>

  </section>


  <!-- ==================================================
       OVERVIEW LINK
  ================================================== -->

  <footer class="practice-home__footer">

    <p class="practice-home__footer-text">
      Looking for your previous attempts or overall progress?
    </p>

    <a
      class="practice-home__footer-link"
      routerLink="/practice/overview"
    >
      View your practice overview

      <iconify-icon
        icon="lucide:arrow-up-right"
        aria-hidden="true"
      ></iconify-icon>

    </a>

  </footer>

</div>
