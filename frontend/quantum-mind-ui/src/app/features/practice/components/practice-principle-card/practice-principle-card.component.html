<article class="practice-principle-card">

  <span
    class="practice-principle-card__icon"
    aria-hidden="true"
  >
    <iconify-icon
      [icon]="icon()"
    ></iconify-icon>
  </span>

  <div class="practice-principle-card__content">

    <h3 class="practice-principle-card__title">
      {{ title() }}
    </h3>

    <p class="practice-principle-card__description">
      {{ description() }}
    </p>

  </div>

</article>
