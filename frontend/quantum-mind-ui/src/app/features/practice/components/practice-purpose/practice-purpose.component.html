<section
  class="practice-purpose"
  aria-labelledby="practice-purpose-title"
>

  <!-- ==================================================
       SECTION HEADER
  ================================================== -->

  <div class="practice-purpose__header">

    <span class="practice-purpose__label">
      WHY PRACTICE
    </span>

    <h2
      id="practice-purpose-title"
      class="practice-purpose__title"
    >
      Learning becomes stronger when you use it.
    </h2>

    <p class="practice-purpose__description">
      Quizzes give you a chance to retrieve ideas, reason through
      problems, and check whether a concept is truly clear.
      They are designed to complement the lessons, not replace them.
    </p>

  </div>


  <!-- ==================================================
       PRINCIPLES
  ================================================== -->

  <div class="practice-purpose__principles">

    <app-practice-principle-card
      icon="lucide:brain"
      title="Recall what you learned"
      description="Bring concepts back from memory and strengthen your ability to recognize and use them."
    ></app-practice-principle-card>


    <app-practice-principle-card
      icon="lucide:lightbulb"
      title="Reason through problems"
      description="Go beyond remembering definitions by applying ideas and working through different situations."
    ></app-practice-principle-card>


    <app-practice-principle-card
      icon="lucide:scan-search"
      title="Find what needs attention"
      description="Use your results to recognize gaps in understanding and return to the lessons when something needs more work."
    ></app-practice-principle-card>

  </div>

</section>
