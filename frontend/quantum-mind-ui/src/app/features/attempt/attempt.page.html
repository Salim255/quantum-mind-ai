<div class="attempt">

  <!-- ============================================================
       HEADER
  ============================================================ -->

  <app-attempt-header
    [totalQuestions]="totalQuestions()"
    [questionNumber]="questionNumber()"
    [topic]="topic()"></app-attempt-header>


  <!-- ============================================================
       CONTENT
  ============================================================ -->

  <main class="attempt__content">

    <!-- Question -->
    <app-question
      [question]="currentQuestion()"
      [questionNumber]="questionNumber()"></app-question>

    <section
      class="attempt__question"
      aria-labelledby="attempt-question"
    >

      <span
        class="attempt__question-number"
        aria-hidden="true"
      >
        {{ questionNumber() | number:'2.0' }}
      </span>

      <h2
        id="attempt-question"
        class="attempt__question-title"
      >
        {{ currentQuestion().text }}
      </h2>

    </section>


    <!-- Answers -->

    <section
      class="attempt__answers"
      aria-label="Answer choices"
    >

      @for (
        answer of currentQuestion().answers;
        track answer.id;
        let index = $index
      ) {

        <button
          type="button"
          class="attempt__answer"
          [class.attempt__answer--selected]="
            selectedAnswerId() === answer.id
          "
          [attr.aria-pressed]="selectedAnswerId() === answer.id"
          (click)="selectAnswer(answer.id)"
        >

          <span
            class="attempt__answer-index"
            aria-hidden="true"
          >
            {{ index + 1 | number:'2.0' }}
          </span>

          <span class="attempt__answer-text">
            {{ answer.text }}
          </span>

          <span
            class="attempt__answer-indicator"
            aria-hidden="true"
          >

            @if (selectedAnswerId() === answer.id) {

              <iconify-icon
                icon="lucide:check"
              ></iconify-icon>

            }

          </span>

        </button>

      }

    </section>

  </main>


  <!-- ============================================================
       FOOTER / PAGINATION
  ============================================================ -->

  <footer class="attempt__footer">

    <button
      type="button"
      class="attempt__previous"
      [disabled]="!hasPrevious()"
      (click)="previousQuestion()"
    >

      <iconify-icon
        icon="lucide:arrow-left"
        aria-hidden="true"
      ></iconify-icon>

      <span>
        Previous
      </span>

    </button>


    <span class="attempt__footer-progress">
      {{ questionNumber() }} / {{ totalQuestions() }}
    </span>


    <button
      type="button"
      class="attempt__continue"
      [disabled]="!selectedAnswerId()"
      (click)="submitAnswer()"
    >

      <span>
        {{ hasNext() ? 'Continue' : 'Finish' }}
      </span>

      <iconify-icon
        [icon]="
          hasNext()
            ? 'lucide:arrow-right'
            : 'lucide:check'
        "
        aria-hidden="true"
      ></iconify-icon>

    </button>

  </footer>

</div>
