<section
  class="question"
  aria-labelledby="question-title"
>
  <div class="question__panel">

    <span class="question__label">
      Question
    </span>

    <h2
      id="question-title"
      class="question__title"
    >
      {{ question().text }}
    </h2>

    <p class="question__instruction">
      Select the best answer
    </p>

  </div>
</section>
