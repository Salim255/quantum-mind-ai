<header class="attempt-result-header">

  <div class="attempt-result-header__status">

    <span
      class="attempt-result-header__status-icon"
      aria-hidden="true"
    >
      <iconify-icon icon="lucide:check"></iconify-icon>
    </span>

    <span class="attempt-result-header__eyebrow">
      Assessment complete
    </span>

  </div>

  <h1
    id="attempt-result-title"
    class="attempt-result-header__title"
  >
    Well done!
  </h1>

  <p class="attempt-result-header__description">
    You completed the assessment for
    <strong>{{ topicTitle }}</strong>.
  </p>

</header>
