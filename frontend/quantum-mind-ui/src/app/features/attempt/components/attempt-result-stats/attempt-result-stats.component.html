<div
  class="attempt-result-stats"
  aria-label="Assessment performance"
>

  <div class="attempt-result-stats__stat">
    <span class="attempt-result-stats__value">
      {{ correctAnswers }}
    </span>

    <span class="attempt-result-stats__label">
      Correct
    </span>
  </div>


  <div
    class="attempt-result-stats__separator"
    aria-hidden="true"
  ></div>


  <div class="attempt-result-stats__stat">
    <span class="attempt-result-stats__value">
      {{ totalQuestions }}
    </span>

    <span class="attempt-result-stats__label">
      Questions
    </span>
  </div>


  <div
    class="attempt-result-stats__separator"
    aria-hidden="true"
  ></div>


  <div class="attempt-result-stats__stat">
    <span class="attempt-result-stats__value">
      {{ incorrectAnswers }}
    </span>

    <span class="attempt-result-stats__label">
      Incorrect
    </span>
  </div>

</div>
