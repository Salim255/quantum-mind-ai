<header class="attempt-header">
  <div class="attempt-header__main">

    <!-- Exit -->
    <div class="attempt-header__exit">
      <app-button
        label="Exit quiz"
        icon="lucide:arrow-left"
        variant="ghost"
        size="medium"
        ariaLabel="Exit current quiz"
        (clicked)="exitAttempt()"
      />
    </div>


    <!-- Quiz identity -->
    <div class="attempt-header__identity">

      <span class="attempt-header__eyebrow">
        Quiz
      </span>

      <h1 class="attempt-header__title">
        {{ topic().title }}
      </h1>

      <span class="attempt-header__category">
        {{ topic().category }}
      </span>

    </div>


    <!-- Progress -->
    <div class="attempt-header__progress">

      <div class="attempt-header__progress-count">
        <span class="attempt-header__progress-current">
          {{ questionNumber() }}
        </span>

        <span class="attempt-header__progress-total">
          / {{ totalQuestions() }}
        </span>
      </div>

      <div
        class="attempt-header__progress-track"
        role="progressbar"
        [attr.aria-valuenow]="questionNumber()"
        [attr.aria-valuemin]="1"
        [attr.aria-valuemax]="totalQuestions()"
        [attr.aria-label]="
          'Question ' + questionNumber() + ' of ' + totalQuestions()
        "
      >
        <span
          class="attempt-header__progress-fill"
          [style.width.%]="progressPercentage()"
        ></span>
      </div>

    </div>

  </div>
</header>
