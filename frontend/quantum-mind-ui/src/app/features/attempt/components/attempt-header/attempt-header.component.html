<header class="attempt-header">
  <div class="attempt-header__inner">

    <div class="attempt-header__exit">
      <app-button
        label="Exit"
        icon="lucide:arrow-left"
        variant="ghost"
        size="small"
        ariaLabel="Exit current quiz"
        (clicked)="exitAttempt()"
      />
    </div>

    <div class="attempt-header__identity">
      <div class="attempt-header__eyebrow">
        <span class="attempt-header__status"></span>
        <span>Assessment</span>
        <span class="attempt-header__dot"></span>
        <span>{{ topic().category }}</span>
      </div>

      <h1 class="attempt-header__title">
        {{ topic().title }}
      </h1>
    </div>

    <div class="attempt-header__progress">

      <div class="attempt-header__progress-info">
        <span class="attempt-header__progress-label">
          Progress
        </span>

        <span class="attempt-header__count">
          <strong>
            {{ questionNumber() | number:'2.0' }}
          </strong>
          <span>/</span>
          <em>
            {{ totalQuestions() | number:'2.0' }}
          </em>
        </span>
      </div>

      <div
        class="attempt-header__track"
        role="progressbar"
        [attr.aria-valuenow]="questionNumber()"
        [attr.aria-valuemin]="1"
        [attr.aria-valuemax]="totalQuestions()"
        [attr.aria-label]="
          'Question ' + questionNumber() + ' of ' + totalQuestions()
        "
      >
        <span
          class="attempt-header__fill"
          [style.width.%]="progressPercentage()"
        ></span>
      </div>

    </div>

  </div>
</header>
