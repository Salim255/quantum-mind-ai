<article class="practice-overview-metric-card">
  <header class="practice-overview-metric-card__header">
    <span
      class="practice-overview-metric-card__icon"
      aria-hidden="true"
    >
      <iconify-icon [icon]="icon()"></iconify-icon>
    </span>

    <span class="practice-overview-metric-card__label">
      {{ label() }}
    </span>
  </header>

  <div class="practice-overview-metric-card__body">
    <div class="practice-overview-metric-card__value">
      {{ value() }}
    </div>

    <p class="practice-overview-metric-card__description">
      {{ description() }}
    </p>
  </div>

  <footer class="practice-overview-metric-card__footer">
    @if (actionLabel() && actionRoute()) {
      <a
        class="practice-overview-metric-card__action"
        [routerLink]="actionRoute()"
      >
        <span>{{ actionLabel() }}</span>

        <iconify-icon
          icon="lucide:arrow-right"
          aria-hidden="true"
        ></iconify-icon>
      </a>
    }

    @if (context()) {
      <span class="practice-overview-metric-card__context">
        {{ context() }}
      </span>
    }
  </footer>
</article>
