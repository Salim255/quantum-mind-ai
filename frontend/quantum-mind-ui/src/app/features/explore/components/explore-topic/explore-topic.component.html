<button
  type="button"
  class="explore-topic"
  (click)="openAttempt()"
>
  <span class="explore-topic__index" aria-hidden="true">
    {{ index() }}
  </span>

  <span class="explore-topic__content">
    <span class="explore-topic__title">
      {{ exploreTopic()?.topic?.title }}
    </span>


  </span>

  <span class="explore-topic__action" aria-hidden="true">
    @if (!exploreTopic().latestAttempt) {
      <span class="explore-topic__action-label">
        Take the quiz
      </span>
      <iconify-icon icon="lucide:arrow-right"></iconify-icon>
    } @else if (!exploreTopic().latestAttempt?.is_completed) {
      <span class="explore-topic__action-label">
        Resume quiz
      </span>
      <iconify-icon icon="lucide:play"></iconify-icon>
    } @else {
      <span class="explore-topic__action-label">
        Retake quiz
      </span>
      <iconify-icon icon="lucide:rotate-ccw"></iconify-icon>
    }
  </span>
</button>
