<div class="explore-home">

  <app-explore-header />

  <section class="explore-home__topics">

    @for (
      topic of topics();
      track topic.title;
      let index = $index
    ) {

      <app-explore-topic
        [topic]="topic"
        [index]="index + 1"
      />

    }

  </section>

</div>
