<div class="explore-home">

  <app-explore-header />

  <section class="explore-home__topics">

    @for (
      data of topics();
      track data.topic.title;
      let index = $index
    ) {

      <app-explore-topic
        [topic]="data.topic"
        [index]="index + 1"
      />

    }

  </section>

</div>
