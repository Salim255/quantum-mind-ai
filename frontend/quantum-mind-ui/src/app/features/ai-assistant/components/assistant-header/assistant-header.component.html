<header class="assistant-header">

  <div class="assistant-header__identity">

    <span
      class="assistant-header__icon"
      aria-hidden="true"
    >
      <iconify-icon
        icon="lucide:sparkles"
      ></iconify-icon>
    </span>

    <div class="assistant-header__text">

      <h2 class="assistant-header__title">
        AI Assistant
      </h2>

      <span class="assistant-header__context">
        About this content
      </span>

    </div>

  </div>


  <button
    class="assistant-header__close"
    type="button"
    aria-label="Close AI Assistant"
    (click)="onCloseAssistant()"
  >
    <iconify-icon
      icon="lucide:x"
      aria-hidden="true"
    ></iconify-icon>
  </button>

</header>
