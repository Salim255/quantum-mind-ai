<section
  class="progress-snapshot"
  aria-label="Learning progress"
>
  <app-progress-snapshot-card
    label="Overall mastery"
    value="68%"
    description="Across the concepts you have practiced so far."
    icon="lucide:target"
    [featured]="true"
  />

  <app-progress-snapshot-card
    label="Quizzes completed"
    [value]="24"
    description="Practice sessions completed."
    icon="lucide:check-circle"
  />

  <app-progress-snapshot-card
    label="Learning level"
    [value]="12"
    description="Based on your learning activity and mastery."
    icon="lucide:arrow-up"
  />
</section>
