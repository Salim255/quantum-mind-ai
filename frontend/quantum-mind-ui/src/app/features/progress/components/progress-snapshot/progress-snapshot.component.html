<section
  class="progress-snapshot"
  aria-label="Learning progress"
>

  <!-- ==================================================
       OVERALL MASTERY
  ================================================== -->

  <article
    class="progress-snapshot__metric progress-snapshot__metric--primary"
  >

    <div class="progress-snapshot__metric-top">

      <span class="progress-snapshot__metric-label">
        Overall mastery
      </span>

      <span class="progress-snapshot__metric-icon">
        <iconify-icon
          icon="lucide:target"
          aria-hidden="true"
        ></iconify-icon>
      </span>

    </div>

    <div class="progress-snapshot__metric-value">
      68%
    </div>

    <p class="progress-snapshot__metric-description">
      Across the concepts you have practiced so far.
    </p>

  </article>


  <!-- ==================================================
       LEARNING STREAK
  ================================================== -->

  <article class="progress-snapshot__metric">

    <div class="progress-snapshot__metric-top">

      <span class="progress-snapshot__metric-label">
        Learning streak
      </span>

      <span class="progress-snapshot__metric-icon">
        <iconify-icon
          icon="lucide:flame"
          aria-hidden="true"
        ></iconify-icon>
      </span>

    </div>

    <div class="progress-snapshot__metric-value">
      7 days
    </div>

    <p class="progress-snapshot__metric-description">
      Keep your momentum going.
    </p>

  </article>


  <!-- ==================================================
       QUIZZES
  ================================================== -->

  <article class="progress-snapshot__metric">

    <div class="progress-snapshot__metric-top">

      <span class="progress-snapshot__metric-label">
        Quizzes completed
      </span>

      <span class="progress-snapshot__metric-icon">
        <iconify-icon
          icon="lucide:check-circle"
          aria-hidden="true"
        ></iconify-icon>
      </span>

    </div>

    <div class="progress-snapshot__metric-value">
      24
    </div>

    <p class="progress-snapshot__metric-description">
      Practice sessions completed.
    </p>

  </article>


  <!-- ==================================================
       LEVEL
  ================================================== -->

  <article class="progress-snapshot__metric">

    <div class="progress-snapshot__metric-top">

      <span class="progress-snapshot__metric-label">
        Learning level
      </span>

      <span class="progress-snapshot__metric-icon">
        <iconify-icon
          icon="lucide:arrow-up"
          aria-hidden="true"
        ></iconify-icon>
      </span>

    </div>

    <div class="progress-snapshot__metric-value">
      12
    </div>

    <p class="progress-snapshot__metric-description">
      Based on your learning activity and mastery.
    </p>

  </article>

</section>
