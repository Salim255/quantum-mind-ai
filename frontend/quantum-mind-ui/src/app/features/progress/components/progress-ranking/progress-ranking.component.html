<section
  class="progress-ranking"
  aria-labelledby="progress-ranking-title"
>

  <!-- ==================================================
       MAIN CONTENT
  ================================================== -->

  <div class="progress-ranking__main">

    <span class="progress-ranking__label">
      COMMUNITY
    </span>

    <h2
      id="progress-ranking-title"
      class="progress-ranking__title"
    >
      See how your progress compares.
    </h2>

    <p class="progress-ranking__description">
      Compare your learning activity with other learners
      and see how consistently you are progressing.
    </p>

  </div>


  <!-- ==================================================
       POSITION
  ================================================== -->

  <div class="progress-ranking__position">

    <span class="progress-ranking__position-label">
      Your position
    </span>

    <strong class="progress-ranking__position-value">
      #128
    </strong>

    <span class="progress-ranking__position-context">
      Top 18% of learners
    </span>

  </div>


  <!-- ==================================================
       ACTION
  ================================================== -->

  <a
    class="progress-ranking__action"
    routerLink="/progress/ranking"
  >

    <span>
      View ranking
    </span>

    <iconify-icon
      icon="lucide:arrow-up-right"
      aria-hidden="true"
    ></iconify-icon>

  </a>

</section>
