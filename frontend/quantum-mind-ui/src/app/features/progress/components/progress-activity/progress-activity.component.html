<section
  class="progress-activity"
  aria-labelledby="progress-activity-title"
>

  <!-- ==================================================
       SECTION HEADER
  ================================================== -->

  <header class="progress-activity__header">

    <div class="progress-activity__heading">

      <span class="progress-activity__label">
        ACTIVITY
      </span>

      <h2
        id="progress-activity-title"
        class="progress-activity__title"
      >
        Your learning rhythm.
      </h2>

    </div>

    <p class="progress-activity__description">
      Consistent practice matters more than occasional
      bursts of activity.
    </p>

  </header>


  <!-- ==================================================
       ACTIVITY CARD
  ================================================== -->

  <article class="progress-activity__card">

    <!-- ==================================================
         SUMMARY
    ================================================== -->

    <div class="progress-activity__summary">

      <div class="progress-activity__total">

        <span class="progress-activity__value">
          18
        </span>

        <span class="progress-activity__value-label">
          practice sessions
        </span>

      </div>

      <span class="progress-activity__period">
        Last 30 days
      </span>

    </div>


    <!-- ==================================================
         CHART
    ================================================== -->

    <div class="progress-activity__chart">

      <div
        class="progress-activity__placeholder"
        aria-hidden="true"
      >

        <span class="progress-activity__placeholder-label">
          Learning activity
        </span>

      </div>

    </div>

  </article>

</section>
