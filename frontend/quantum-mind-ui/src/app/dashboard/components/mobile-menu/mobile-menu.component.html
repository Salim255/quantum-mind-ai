<section
  class="mobile-menu"
  aria-label="Mobile navigation"
>

  <nav
    class="mobile-menu__navigation"
    aria-label="Main navigation"
  >

    <ul class="mobile-menu__list">

      @for (nav of items()?.children; track nav.path) {

        <li class="mobile-menu__item">

          <a
            class="mobile-menu__link"
            [routerLink]="nav.path"
            routerLinkActive="mobile-menu__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="onNavigate(nav)"
          >

            @if (nav.icon) {

              <span
                class="mobile-menu__link-icon"
                aria-hidden="true"
              >
                <iconify-icon
                  [icon]="nav.icon"
                />
              </span>

            }

            <span class="mobile-menu__link-label">
              {{ nav.name }}
            </span>

            <iconify-icon
              class="mobile-menu__link-chevron"
              icon="lucide:chevron-right"
              aria-hidden="true"
            />

          </a>

        </li>

      }

    </ul>

  </nav>

</section>
