<aside
  class="aside-layout"
  [class.aside-layout--primary-only]="hideSecondaryNav()"
>
  <app-aside-primary-nav
    class="aside-layout__primary-nav">
  </app-aside-primary-nav>

  @if (!hideSecondaryNav()) {
    <app-aside-secondary-nav
      class="aside-layout__secondary-nav"
      [items]="items()">
    </app-aside-secondary-nav>
  }
</aside>
