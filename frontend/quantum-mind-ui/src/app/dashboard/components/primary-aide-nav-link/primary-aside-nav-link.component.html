<a
  class="primary-aside-nav-link"
  [routerLink]="nav.path"
  routerLinkActive="primary-aside-nav-link--active"
  [routerLinkActiveOptions]="{ exact: true }"
  (click)="onNavigate(nav)"
>

  @if (nav.icon) {

    <iconify-icon
      class="primary-aside-nav-link__icon"
      [icon]="nav.icon"
    />

  }

  @if (!iconOnly) {

    <span class="primary-aside-nav-link__label">
      {{ nav.name }}
    </span>

  }

</a>
