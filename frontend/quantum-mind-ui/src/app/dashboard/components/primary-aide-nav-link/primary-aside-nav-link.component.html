<a
  class="primary-aside-nav-link"
  [routerLink]="nav.path"
  routerLinkActive="primary-aside-nav-link--active"
  [routerLinkActiveOptions]="{ exact: true }"
  (click)="onNavigate(nav)"
>
  @if (nav.icon) {
    <iconify-icon
      class="primary-aside-nav-link__icon"
      [icon]="nav.icon"
    />
  }

  <span
    class="primary-aside-nav-link__label"
    [class.primary-aside-nav-link__label--hidden]="iconOnly"
  >
    {{ nav.name }}
  </span>
</a>
