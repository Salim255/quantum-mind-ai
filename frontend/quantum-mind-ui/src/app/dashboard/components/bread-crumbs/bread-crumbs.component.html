<nav class="bread-crumbs">

    @for(crumb of breadcrumbs(); track $index) {

        <a
            class="bread-crumbs__link"
            [routerLink]="normalizeUrl(crumb.path)"
            routerLinkActive="bread-crumbs__link--active"
            [routerLinkActiveOptions]="{ exact: true }">

            {{ crumb.name }}

        </a>

        @if(!$last) {

            <span class="bread-crumbs__separator">

                /
            </span>
        }
    }
</nav>
