# -----------------------------------------------------------------------------
# QuantumMind - PostgreSQL StatefulSet
# -----------------------------------------------------------------------------
#
# PostgreSQL is the relational database used by QuantumMind.
#
# Unlike FastAPI or Angular, PostgreSQL stores application data that must
# survive a Pod restart.
#
# Therefore we use a StatefulSet instead of a normal Deployment.
#
# Architecture:
#
#   StatefulSet
#       │
#       └── PostgreSQL Pod
#              │
#              └── Persistent Volume Claim
#                    │
#                    └── Persistent Volume
#                          │
#                          └── PostgreSQL data
#
# If the PostgreSQL Pod is recreated, Kubernetes reconnects it to its
# persistent storage.
#
# IMPORTANT:
#
# This is NOT a high-availability PostgreSQL cluster.
#
# We are intentionally starting with ONE PostgreSQL instance because our
# current K3s cluster has one physical worker/VPS.
#
# Later, PostgreSQL HA would require proper database replication and
# failover architecture. Simply setting replicas: 2 would NOT be enough.
#
# -----------------------------------------------------------------------------

# StatefulSets are part of the apps/v1 Kubernetes API.
apiVersion: apps/v1

# We are creating a StatefulSet because PostgreSQL is stateful.
kind: StatefulSet

# -----------------------------------------------------------------------------
# Resource metadata
# -----------------------------------------------------------------------------
metadata:

  # Name of our PostgreSQL StatefulSet.
  #
  # This identifies the PostgreSQL workload belonging to QuantumMind.
  name: quantummind-postgres

  # PostgreSQL belongs to the QuantumMind namespace.
  namespace: quantummind

  # Labels help Kubernetes and administrators identify this workload.
  labels:
    app: quantummind
    component: postgres

# -----------------------------------------------------------------------------
# StatefulSet specification
# -----------------------------------------------------------------------------
spec:

  # ---------------------------------------------------------------------------
  # Number of PostgreSQL instances
  # ---------------------------------------------------------------------------
  #
  # We intentionally start with ONE PostgreSQL instance.
  #
  # PostgreSQL is stateful, so simply increasing this value would NOT create
  # a proper PostgreSQL HA cluster.
  replicas: 1

  # ---------------------------------------------------------------------------
  # Service name
  # ---------------------------------------------------------------------------
  #
  # This is the governing Service name used by the StatefulSet.
  #
  # The corresponding Kubernetes Service is managed separately in:
  #
  #   services/postgres.yaml
  #
  serviceName: quantummind-postgres

  # ---------------------------------------------------------------------------
  # Pod selector
  # ---------------------------------------------------------------------------
  #
  # The StatefulSet manages Pods matching these labels.
  #
  # These labels must match the labels defined in:
  #
  #   spec.template.metadata.labels
  #
  selector:
    matchLabels:
      app: quantummind
      component: postgres

  # ---------------------------------------------------------------------------
  # Pod template
  # ---------------------------------------------------------------------------
  #
  # This section defines the PostgreSQL Pod that the StatefulSet creates.
  #
  template:

    metadata:

      # Labels applied to the PostgreSQL Pod.
      #
      # The Service uses these labels to find the PostgreSQL Pod.
      labels:
        app: quantummind
        component: postgres

    spec:

      # -----------------------------------------------------------------------
      # PostgreSQL container
      # -----------------------------------------------------------------------
      containers:

        - name: postgres

          # -------------------------------------------------------------------
          # PostgreSQL container image
          # -------------------------------------------------------------------
          #
          # The official PostgreSQL image supports ARM64, which is important
          # because our K3s worker is an ARM64 machine.
          #
          # We pin the major version instead of using "latest".
          #
          # Pinning the version makes deployments more predictable.
          image: postgres:16

          # Pull the image only when it isn't already available locally.
          imagePullPolicy: IfNotPresent

          # -------------------------------------------------------------------
          # PostgreSQL network port
          # -------------------------------------------------------------------
          #
          # PostgreSQL listens on TCP port 5432 inside the container.
          #
          # This does NOT expose PostgreSQL publicly.
          #
          # The Kubernetes Service provides internal communication between
          # FastAPI and PostgreSQL.
          ports:

            - name: postgres
              containerPort: 5432
              protocol: TCP

          # -------------------------------------------------------------------
          # PostgreSQL configuration from Kubernetes Secret
          # -------------------------------------------------------------------
          #
          # PostgreSQL requires these environment variables:
          #
          #   POSTGRES_DB
          #   POSTGRES_USER
          #   POSTGRES_PASSWORD
          #
          # These values are stored in:
          #
          #   quantummind-database-secret
          #
          # Keeping credentials in a Secret means the actual password does
          # not need to be stored in this StatefulSet manifest.
          #
          # Kubernetes injects the Secret values into the PostgreSQL
          # container as environment variables.
          envFrom:

            - secretRef:
                name: quantummind-database-secret

          # -------------------------------------------------------------------
          # PostgreSQL persistent storage
          # -------------------------------------------------------------------
          #
          # PostgreSQL stores its database files under:
          #
          #   /var/lib/postgresql/data
          #
          # This directory is backed by the PersistentVolumeClaim created by
          # the volumeClaimTemplates section below.
          #
          # IMPORTANT:
          #
          # The "name" here MUST match:
          #
          #   volumeClaimTemplates.metadata.name
          #
          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

          # -------------------------------------------------------------------
          # Resource requests and limits
          # -------------------------------------------------------------------
          #
          # Our VPS already runs other production workloads.
          #
          # These are conservative starting values.
          #
          # requests:
          #   Minimum resources Kubernetes reserves for the container.
          #
          # limits:
          #   Maximum resources the container is allowed to consume.
          #
          # We can tune these later after measuring actual PostgreSQL usage.
          resources:

            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "768Mi"

  # ----------------------------------------------------------------------------
  # Persistent storage
  # ----------------------------------------------------------------------------
  #
  # PostgreSQL data must survive Pod restarts and Pod recreation.
  #
  # A container's writable filesystem is not the correct place to keep
  # production database data.
  #
  # StatefulSet's volumeClaimTemplates allows Kubernetes to automatically
  # create a PersistentVolumeClaim for the PostgreSQL Pod.
  #
  # Architecture:
  #
  #   StatefulSet
  #       │
  #       └── quantummind-postgres-0
  #                    │
  #                    ▼
  #          quantummind-postgres-data
  #                    │
  #                    ▼
  #              PersistentVolume
  #                    │
  #                    ▼
  #                 10 GiB
  #
  # Because replicas is currently 1, Kubernetes creates one PVC.
  #
  # IMPORTANT:
  #
  # The name is intentionally application-specific:
  #
  #   quantummind-postgres-data
  #
  # This makes it easy to distinguish QuantumMind storage from storage
  # belonging to other applications on the same VPS/K3s cluster.
  #
  # Examples for future applications could be:
  #
  #   housori-postgres-data
  #   zentrabank-postgres-data
  #   portfolio-postgres-data
  #
  # ----------------------------------------------------------------------------
  volumeClaimTemplates:

    - metadata:

        # ----------------------------------------------------------------------
        # PersistentVolumeClaim name
        # ----------------------------------------------------------------------
        #
        # "quantummind" identifies the application.
        # "postgres" identifies the database component.
        # "data" identifies the purpose of the storage.
        #
        # This name MUST match the volumeMount name above.
        name: postgres-data

      spec:

        # ----------------------------------------------------------------------
        # Access mode
        # ----------------------------------------------------------------------
        #
        # ReadWriteOnce (RWO) means the volume can be mounted for read/write
        # access by a Pod on one Kubernetes node.
        #
        # This matches our current architecture:
        #
        #   one VPS
        #   one K3s node
        #   one PostgreSQL Pod
        #
        accessModes:
          - ReadWriteOnce

        # ----------------------------------------------------------------------
        # Storage class
        # ----------------------------------------------------------------------
        #
        # K3s provides the "local-path" StorageClass.
        #
        # It provisions storage from the local filesystem of our VPS.
        #
        # This is appropriate for our current single-node architecture.
        #
        # IMPORTANT:
        #
        # Local storage is NOT replicated storage.
        #
        # If the VPS itself is lost, the local database storage is also
        # at risk. Therefore PostgreSQL backups will be important later.
        #
        storageClassName: local-path

        # ----------------------------------------------------------------------
        # Requested storage capacity
        # ----------------------------------------------------------------------
        #
        # PostgreSQL starts with 10 GiB of persistent storage.
        #
        # We can increase the storage later if the database grows and the
        # StorageClass/filesystem supports volume expansion.
        #
        resources:

          requests:
            storage: 10Gi