apiVersion: v1
kind: Service

metadata:
  # Stable Kubernetes name used by other Pods to reach FastAPI.
  name: quantummind-server

  # Keep the API inside the QuantumMind namespace.
  namespace: quantummind

spec:
  # NodePort exposes the Service on the Kubernetes node.
  # We are using this temporarily so the host nginx can reach it.
  type: NodePort

  # IMPORTANT:
  # These selectors must match the labels on the FastAPI Deployment.
  selector:
    app: quantummind
    component: server

  ports:
    - name: http

      # Port exposed by the Kubernetes Service.
      port: 8000

      # Port exposed by the FastAPI container.
      targetPort: 8000

      protocol: TCP

      # Port exposed on the VPS/node.
      # Host nginx will eventually proxy /api/ to this port.
      nodePort: 31800