# -----------------------------------------------------------------------------
# QuantumMind - Angular Client Service
# -----------------------------------------------------------------------------
#
# PURPOSE
# -------
# This Service provides a stable network endpoint for the
# QuantumMind Angular frontend.
#
# The Angular application runs inside a Kubernetes Pod. Pods are not given
# permanent IP addresses, so other components should not connect directly
# to a Pod IP.
#
# Instead, this Service provides a stable Kubernetes endpoint:
#
#     quantummind-client:80
#
# Kubernetes DNS resolves that name to this Service.
#
#
# CURRENT EXPOSURE MODEL
# ----------------------
# This Service currently uses NodePort.
#
# We are using NodePort temporarily because:
#
#   - K3s Traefik is disabled
#   - the VPS already has host nginx listening on ports 80/443
#   - we want host nginx to forward traffic into Kubernetes
#
# The traffic flow will be:
#
#     Internet
#        |
#        v
#     Host nginx
#        |
#        | HTTP/HTTPS
#        v
#     K3s node :31080
#        |
#        v
#     quantummind-client Service :80
#        |
#        v
#     Angular Pod :80
#
#
# IMPORTANT
# ---------
# PostgreSQL and Qdrant remain internal ClusterIP Services.
#
# They are NOT exposed through NodePort because they must not be directly
# reachable from outside the Kubernetes cluster.
#
#
# FUTURE ARCHITECTURE
# -------------------
# Later, if we introduce a dedicated Kubernetes Ingress controller,
# this Service can be changed back to:
#
#     type: ClusterIP
#
# The application itself does not need to change.
# -----------------------------------------------------------------------------

apiVersion: v1
kind: Service

metadata:
  # ---------------------------------------------------------------------------
  # Service name
  # ---------------------------------------------------------------------------
  #
  # Kubernetes creates an internal DNS record for this Service.
  #
  # From another Pod in the "quantummind" namespace, the frontend can be
  # reached using:
  #
  #     http://quantummind-client
  #
  # The explicit Service port is 80.
  name: quantummind-client

  # Keep the frontend Service inside the QuantumMind namespace.
  namespace: quantummind

  labels:
    # Identifies the application.
    app: quantummind

    # Identifies this component as the Angular client.
    component: client

spec:
  # ---------------------------------------------------------------------------
  # Service type
  # ---------------------------------------------------------------------------
  #
  # NodePort exposes this Service through a specific port on the Kubernetes
  # node.
  #
  # We are using NodePort temporarily so the host nginx running on the same
  # VPS can forward external HTTP/HTTPS traffic into Kubernetes.
  #
  # The external path will eventually be:
  #
  #     Browser
  #        |
  #        v
  #     Host nginx
  #        |
  #        v
  #     Kubernetes Node :31080
  #        |
  #        v
  #     quantummind-client:80
  #        |
  #        v
  #     Angular Pod:80
  #
  type: NodePort

  # ---------------------------------------------------------------------------
  # HTTP port
  # ---------------------------------------------------------------------------
  #
  # Our Angular production container serves its compiled static files through
  # nginx on port 80.
  #
  # There are three important port values here:
  #
  #   port:
  #       The port exposed by the Kubernetes Service.
  #
  #   targetPort:
  #       The port on the actual Angular Pod/container.
  #
  #   nodePort:
  #       The port exposed on the Kubernetes node.
  #
  # Host nginx will later connect to port 31080 on the VPS.
  # Kubernetes then forwards that traffic to the Service and ultimately
  # to the Angular Pod.
  # ---------------------------------------------------------------------------
  ports:
    - name: http

      # Port exposed by the Kubernetes Service.
      port: 80

      # Port exposed by the Angular nginx container.
      targetPort: 80

      # Use TCP for HTTP traffic.
      protocol: TCP

      # Port exposed on the Kubernetes node.
      #
      # Host nginx will later use this port as its upstream.
      nodePort: 31080

  # ---------------------------------------------------------------------------
  # Pod selector
  # ---------------------------------------------------------------------------
  #
  # Kubernetes uses these labels to determine which Pods belong behind this
  # Service.
  #
  # These labels MUST match deployments/client.yaml:
  #
  #     app: quantummind
  #     component: client
  #
  # If they don't match, the Service will have no endpoints.
  # ---------------------------------------------------------------------------
  selector:
    app: quantummind
    component: client